---
- name: Deploy Cumulus VX outlier
  hosts: cumulus
  gather_facts: false
  tasks:
    - name: Copy Cumulus NVUE config script
      ansible.builtin.copy:
        src: ../ansible/host_vars/{{ inventory_hostname }}/cumulus-nvue-config.sh
        dest: /tmp/cumulus-nvue-config.sh
        mode: '0755'
    - name: Apply Cumulus NVUE config
      ansible.builtin.shell: |
        set -e
        grep -vE '^\s*(#|$)' /tmp/cumulus-nvue-config.sh | grep -vE '^\s*nv config apply\b' | sh
        nv config apply -y
      changed_when: true
