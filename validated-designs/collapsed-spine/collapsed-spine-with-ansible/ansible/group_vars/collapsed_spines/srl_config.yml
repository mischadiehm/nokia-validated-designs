---
# Spine layer (spine1, spine2), merged into srl_config by
# group_vars/srl/srl_config.yml. Per-spine specifics (ASN, router-id, system0
# IP, VLAN/IRB/EVI data plane, ESI preference, BGP, lags) live in
# host_vars/<spine>.yml under srl_host.
srl_spine_common:
  set:
    routing-policy:
      prefix-set:
        prefixset-dc1-collapsed-spine:
          prefix:
            192.0.2.0/24:
              mask-length-range: 32..32
      policy:
        ebgp-isl-export-policy-dc1-collapsed-spine:
          default-action:
            policy-result: reject
          statement:
            '10':
              match:
                protocol: local
                prefix:
                  prefix-set: prefixset-dc1-collapsed-spine
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '15':
              match:
                protocol: bgp
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '20':
              match:
                protocol: aggregate
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '25':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 1
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '30':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 2
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '35':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 3
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '40':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 4
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '45':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 5
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
        ebgp-isl-import-policy-dc1-collapsed-spine:
          default-action:
            policy-result: reject
          statement:
            '10':
              match:
                protocol: bgp
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '25':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 1
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '30':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 2
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '35':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 3
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '40':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 4
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
            '45':
              match:
                bgp:
                  evpn:
                    route-type:
                      - 5
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
    bfd:
      subinterface:
        ethernet-1/31.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/32.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
