---
- name: Create endpoint bonds
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'ip link add {{ item.key }} type bond mode {{ item.value.mode }} 2>/dev/null || true;
      ip link set {{ item.key }} down'
  loop: "{{ bonds | default({}) | dict2items }}"
  changed_when: false
  when: not ansible_check_mode

- name: Attach endpoint bond members
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'ip link set {{ item.1 }} down;
      ip link set {{ item.1 }} master {{ item.0.key }} 2>/dev/null || true;
      ip link set {{ item.1 }} up'
  loop: "{{ bonds | default({}) | dict2items | subelements('value.members', skip_missing=True) }}"
  changed_when: false
  when: not ansible_check_mode

- name: Create endpoint VLAN interfaces
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'ip link set {{ item.key.split(".")[0] }} up;
      ip link add link {{ item.key.split(".")[0] }} name {{ item.key }} type vlan id {{ item.value.vlan }} 2>/dev/null || true;
      ip link set {{ item.key }} up'
  loop: "{{ interfaces | default({}) | dict2items }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - item.value.vlan is defined

- name: Enable endpoint base interfaces
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: "ip link set {{ item.key }} up"
  loop: "{{ interfaces | default({}) | dict2items }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - item.value.vlan is not defined

- name: Add endpoint IPv4 addresses
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: "sh -lc 'ip addr add {{ item.1 }} dev {{ item.0.key }} 2>/dev/null || true'"
  loop: "{{ interfaces | default({}) | dict2items | subelements('value.ipv4', skip_missing=True) }}"
  changed_when: false
  when: not ansible_check_mode

- name: Add endpoint IPv6 addresses
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: "sh -lc 'ip -6 addr add {{ item.1 }} dev {{ item.0.key }} 2>/dev/null || true'"
  loop: "{{ interfaces | default({}) | dict2items | subelements('value.ipv6', skip_missing=True) }}"
  changed_when: false
  when: not ansible_check_mode

- name: Add endpoint IPv4 connected routes to policy tables
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'ip -o -4 addr show dev {{ item.dev }} scope global |
      awk "{print \$4}" |
      while read cidr; do
      addr=${cidr%/*};
      network=$(python3 -c "import ipaddress, sys; print(ipaddress.ip_interface(sys.argv[1]).network)" "${cidr}");
      ip route add ${network} dev {{ item.dev }} src ${addr}
      table {{ item.table }} 2>/dev/null || true;
      done'
  loop: "{{ routes | default([]) }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - item.family == "ipv4"

- name: Add endpoint IPv6 connected routes to policy tables
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'ip -o -6 addr show dev {{ item.dev }} scope global |
      awk "{print \$4}" |
      while read cidr; do
      network=$(python3 -c "import ipaddress, sys; print(ipaddress.ip_interface(sys.argv[1]).network)" "${cidr}");
      ip -6 route add ${network} dev {{ item.dev }}
      table {{ item.table }} 2>/dev/null || true;
      done'
  loop: "{{ routes | default([]) }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - item.family == "ipv6"

- name: Add endpoint routes
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'ip {{ "-6 " if item.family == "ipv6" else "" }}route add default
      via {{ item.via }} dev {{ item.dev }} table {{ item.table }} 2>/dev/null || true'
  loop: "{{ routes | default([]) }}"
  changed_when: false
  when: not ansible_check_mode

- name: Add endpoint IPv4 source policy rules
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'for addr in $(ip -o -4 addr show dev {{ item.dev }} scope global |
      awk "{print \$4}" | cut -d/ -f1); do
      ip rule add from ${addr}/32 table {{ item.table }} 2>/dev/null || true;
      done'
  loop: "{{ routes | default([]) }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - item.family == "ipv4"

- name: Add endpoint IPv6 source policy rules
  community.docker.docker_container_exec:
    container: "{{ ansible_host }}"
    command: >-
      sh -lc 'for addr in $(ip -o -6 addr show dev {{ item.dev }} scope global |
      awk "{print \$4}" | cut -d/ -f1); do
      ip -6 rule add from ${addr}/128 table {{ item.table }} 2>/dev/null || true;
      done'
  loop: "{{ routes | default([]) }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - item.family == "ipv6"
