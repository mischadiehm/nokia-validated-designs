---
- name: Collect SR Linux common state
  nokia.srlinux.get:
    paths:
      - path: /network-instance
        datastore: state
      - path: /interface
        datastore: state
  register: srl_validate_common_state

- name: Collect SR Linux spine routing state
  nokia.srlinux.get:
    paths:
      - path: /network-instance[name=default]/protocols/bgp
        datastore: state
      - path: /system/network-instance/protocols/evpn/ethernet-segments
        datastore: state
  register: srl_validate_spine_state
  when: inventory_hostname in groups["collapsed_spines"]

- name: Run SR Linux common validation show commands
  nokia.srlinux.cli:
    commands:
      - show network-instance summary
      - show interface lag*
    output_format: text
  register: srl_validate_common_show

- name: Run SR Linux spine validation show commands
  nokia.srlinux.cli:
    commands:
      - show network-instance default protocols bgp neighbor
      - show system network-instance ethernet-segments
    output_format: text
  register: srl_validate_spine_show
  when: inventory_hostname in groups["collapsed_spines"]

- name: Build SR Linux validation facts
  ansible.builtin.set_fact:
    srl_validate_expected_network_instances: "{{ srl_config['set']['network-instance'].keys() | list }}"
    srl_validate_expected_lags: "{{ srl_config['set']['interface'].keys() | select('match', '^lag') | list }}"
    srl_validate_state_network_instances: >-
      {{ srl_validate_common_state.result[0]['srl_nokia-network-instance:network-instance'] | default([]) }}
    srl_validate_state_interfaces: >-
      {{ srl_validate_common_state.result[1]['srl_nokia-interfaces:interface'] | default([]) }}

- name: Assert expected network-instances exist
  ansible.builtin.assert:
    that:
      - item in (srl_validate_state_network_instances | map(attribute='name') | list)
    fail_msg: "Missing network-instance {{ item }} on {{ inventory_hostname }}."
  loop: "{{ srl_validate_expected_network_instances }}"

- name: Assert expected LAGs are operationally healthy
  ansible.builtin.assert:
    that:
      - >-
        (srl_validate_state_interfaces
         | selectattr('name', 'equalto', item)
         | map(attribute='oper-state')
         | first) == 'up'
        or
        (srl_validate_state_interfaces
         | selectattr('name', 'equalto', item)
         | map(attribute='oper-down-reason')
         | first) == 'standby-signaling'
    fail_msg: "LAG {{ item }} is not operationally healthy on {{ inventory_hostname }}."
  loop: "{{ srl_validate_expected_lags }}"

- name: Build SR Linux spine validation facts
  ansible.builtin.set_fact:
    srl_validate_bgp_neighbors: "{{ srl_validate_spine_state.result[0].neighbor | default([]) }}"
    srl_validate_expected_ethernet_segments: >-
      {{ srl_config['set']['system']['network-instance']['protocols']['evpn']['ethernet-segments']['bgp-instance']['1']['ethernet-segment'].keys() | list }}
    srl_validate_ethernet_segments: >-
      {{ srl_validate_spine_state.result[1]['bgp-instance'][0]['ethernet-segment'] | default([]) }}
  when: inventory_hostname in groups["collapsed_spines"]

- name: Assert BGP neighbors are established
  ansible.builtin.assert:
    that:
      - srl_validate_bgp_neighbors | length > 0
      - item['session-state'] == 'established'
    fail_msg: "BGP neighbor {{ item.get('peer-address', 'unknown') }} is not established on {{ inventory_hostname }}."
  loop: "{{ srl_validate_bgp_neighbors }}"
  when: inventory_hostname in groups["collapsed_spines"]

- name: Assert expected ethernet-segments are operationally up
  ansible.builtin.assert:
    that:
      - item in (srl_validate_ethernet_segments | map(attribute='name') | list)
      - >-
        (srl_validate_ethernet_segments
         | selectattr('name', 'equalto', item)
         | map(attribute='oper-state')
         | first) == 'up'
    fail_msg: "Ethernet-segment {{ item }} is not operationally up on {{ inventory_hostname }}."
  loop: "{{ srl_validate_expected_ethernet_segments }}"
  when: inventory_hostname in groups["collapsed_spines"]

- name: Assert SR Linux validation commands succeeded
  ansible.builtin.assert:
    that:
      - srl_validate_common_state is succeeded
      - srl_validate_common_show is succeeded
      - inventory_hostname not in groups["collapsed_spines"] or srl_validate_spine_state is succeeded
      - inventory_hostname not in groups["collapsed_spines"] or srl_validate_spine_show is succeeded
    fail_msg: "SR Linux validation commands failed on {{ inventory_hostname }}."
