# Per-ToR intent (the srl_host layer). Common parts live in group_vars/{srl,tors}/.
# Keep readable; do not store rendered payloads here.
srl_host:
  set:
    system:
      name:
        host-name: d2l-35-tor2
      lldp:
        interface:
          ethernet-1/51:
            admin-state: enable
          ethernet-1/52:
            admin-state: enable
          ethernet-1/56:
            admin-state: enable
    interface:
      ethernet-1/51:
        description: tor2-spine-lag
        admin-state: enable
        ethernet:
          aggregate-id: lag1
          lacp-port-priority: 32768
      ethernet-1/52:
        description: tor2-spine-lag
        admin-state: enable
        ethernet:
          aggregate-id: lag1
          lacp-port-priority: 32768
      ethernet-1/56:
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
            type: bridged
            description: untagged-v10-tor
            admin-state: enable
            vlan:
              encap: untagged
      lag1:
        description: tor2-spine-lag
        subinterface:
          '4096':
            type: bridged
            description: untagged-v10-tor
            admin-state: enable
            vlan:
              encap: untagged
        lag:
          lacp:
            admin-key: 6
            system-id-mac: 00:00:22:22:22:22
    network-instance:
      v10-simple:
        type: mac-vrf
        admin-state: enable
        description: v10-simple
        interface:
          ethernet-1/56.4096: {}
          lag1.4096: {}
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
