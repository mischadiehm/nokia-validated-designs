# Per-ToR intent (the srl_host layer). Common parts live in group_vars/{srl,tors}/.
# Keep readable; do not store rendered payloads here.
srl_host:
  set:
    system:
      name:
        host-name: d3l-28-tor3
      lldp:
        interface:
          ethernet-1/29:
            admin-state: enable
          ethernet-1/30:
            admin-state: enable
          ethernet-1/32:
            admin-state: enable
    interface:
      ethernet-1/29:
        description: tor3-spine-lag
        admin-state: enable
        ethernet:
          aggregate-id: lag1
          lacp-port-priority: 32768
      ethernet-1/30:
        description: tor3-spine-lag
        admin-state: enable
        ethernet:
          aggregate-id: lag1
          lacp-port-priority: 32768
      ethernet-1/32:
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '70':
            type: bridged
            description: tagged-v70-tor
            admin-state: enable
            vlan:
              encap:
                single-tagged:
                  vlan-id: 70
      lag1:
        description: tor3-spine-lag
        subinterface:
          '70':
            type: bridged
            description: tagged-v70-tor
            admin-state: enable
            vlan:
              encap:
                single-tagged:
                  vlan-id: 70
        lag:
          lacp:
            admin-key: 7
            system-id-mac: 00:00:33:33:33:33
    network-instance:
      v70-simple:
        type: mac-vrf
        admin-state: enable
        description: v70-simple
        interface:
          ethernet-1/32.70: {}
          lag1.70: {}
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
