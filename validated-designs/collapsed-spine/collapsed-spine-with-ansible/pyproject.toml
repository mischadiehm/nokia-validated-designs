[project]
name = "collapsed-spine-with-ansible"
version = "0.1.0"
description = "Ansible-managed Nokia collapsed-spine validated design lab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core==2.21.0",
    "ansible-lint==26.4.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
include-package-data = false
