---
# Frontend spine layer: two leaf-facing IPv6-unnumbered ports, shared ASN
# 120, eBGP underlay + EVPN overlay passthrough (inter-as-vpn).
srl_frontend_spine_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      system0:
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
    system:
      lldp:
        interface:
          ethernet-1/1:
            admin-state: enable
          ethernet-1/2:
            admin-state: enable
    network-instance:
      default:
        type: default
        admin-state: enable
        description: 'fabric: dc1-frontend role: spine'
        ip-forwarding:
          receive-ipv4-check: false
        interface:
          ethernet-1/1.0: {}
          ethernet-1/2.0: {}
          system0.0: {}
        protocols:
          bgp:
            admin-state: enable
            ebgp-default-policy:
              import-reject-all: true
              export-reject-all: true
            afi-safi:
              ipv6-unicast:
                admin-state: enable
                multipath:
                  allow-multiple-as: true
                  ebgp:
                    maximum-paths: 2
                evpn:
                  rapid-update: true
              evpn:
                admin-state: enable
                multipath:
                  allow-multiple-as: true
                  maximum-paths: 64
                evpn:
                  inter-as-vpn: true
                  rapid-update: true
            preference:
              ebgp: 170
              ibgp: 170
            route-advertisement:
              rapid-withdrawal: true
              wait-for-fib-install: false
            group:
              bgpgroup-ebgp-dc1:
                admin-state: enable
                export-policy:
                - ebgp-isl-export-policy-dc1
                import-policy:
                - ebgp-isl-import-policy-dc1
                failure-detection:
                  enable-bfd: true
                  fast-failover: true
                afi-safi:
                  evpn:
                    admin-state: enable
                  ipv6-unicast:
                    admin-state: enable
            autonomous-system: 120
            dynamic-neighbors:
              interface:
                ethernet-1/1.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 121
                ethernet-1/2.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 122
    routing-policy:
      prefix-set:
        prefixset-dc1:
          prefix:
            192.0.2.0/24:
              mask-length-range: 32..32
      policy:
        ebgp-isl-export-policy-dc1:
          default-action:
            policy-result: reject
          statement:
            '10':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                prefix-set: prefixset-dc1
                protocol: local
            '15':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                protocol: bgp
            '20':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 1
            '25':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 2
            '30':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 3
            '35':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 4
            '40':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 5
        ebgp-isl-import-policy-dc1:
          default-action:
            policy-result: reject
          statement:
            '10':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                protocol: bgp
            '15':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 1
            '20':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 2
            '25':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 3
            '30':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 4
            '35':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                bgp:
                  evpn:
                    route-type:
                    - 5
