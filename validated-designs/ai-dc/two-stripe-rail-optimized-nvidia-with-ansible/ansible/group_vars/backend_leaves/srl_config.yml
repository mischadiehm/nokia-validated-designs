---
# Backend stripe-leaf layer. Underlay: eBGP over IPv6-unnumbered uplinks to
# both spines (mirrors the EDA Backend rendering style proven in the 3-stage
# variant), with the dc1-backend configlets applied verbatim: DLB
# (flow-dynamic, flowset 256, weighting 70/20/10, ::/0), ipv6 eBGP multipath
# maximum-paths 2, and the egress-backend QoS profiles (WRED/ECN 30..85,
# unicast-0 burst 5211064, scheduler weights, PFC headroom 10).
# all-rails gpuIsolationGroups => rail ports are routed in the default
# network-instance (no per-rail vrfs in this design).
srl_backend_leaf_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      system0:
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
    system:
      lldp:
        interface:
          ethernet-1/1:
            admin-state: enable
          ethernet-1/2:
            admin-state: enable
          ethernet-1/3:
            admin-state: enable
          ethernet-1/4:
            admin-state: enable
      load-balancing:
        dynamic:
          flowset-size: '256'
          inactivity-timer: 50
          mode: flow-dynamic
          link-quality-sampling-interval: 5
          weighting-factor:
            port-utilization: 70
            queue-utilization: 20
            itm-utilization: 10
    network-instance:
      default:
        type: default
        admin-state: enable
        description: 'fabric: dc1-backend role: leaf'
        ip-forwarding:
          receive-ipv4-check: false
        interface:
          ethernet-1/1.0: {}
          ethernet-1/2.0: {}
          system0.0: {}
        ip-load-balancing:
          dynamic-load-balancing:
            prefix:
              ::/0: {}
        protocols:
          bgp:
            admin-state: enable
            ebgp-default-policy:
              import-reject-all: true
              export-reject-all: true
            afi-safi:
              ipv6-unicast:
                admin-state: enable
                multipath:
                  allow-multiple-as: true
                  ebgp:
                    maximum-paths: 2
                evpn:
                  rapid-update: true
            preference:
              ebgp: 170
              ibgp: 170
            route-advertisement:
              rapid-withdrawal: true
              wait-for-fib-install: false
            group:
              bgpgroup-ebgp-dc1:
                admin-state: enable
                export-policy:
                - ebgp-isl-export-policy-dc1
                import-policy:
                - ebgp-isl-import-policy-dc1
                failure-detection:
                  enable-bfd: true
                  fast-failover: true
                afi-safi:
                  ipv6-unicast:
                    admin-state: enable
            dynamic-neighbors:
              interface:
                ethernet-1/1.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 100
                ethernet-1/2.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 100
    routing-policy:
      prefix-set:
        prefixset-dc1:
          prefix:
            192.0.2.0/24:
              mask-length-range: 32..32
      policy:
        ebgp-isl-export-policy-dc1:
          default-action:
            policy-result: reject
          statement:
            '10':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                prefix-set: prefixset-dc1
                protocol: local
            '15':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                protocol: bgp
        ebgp-isl-import-policy-dc1:
          default-action:
            policy-result: reject
          statement:
            '10':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                protocol: bgp
    qos:
      buffer-management:
        buffer-allocation-profile:
          egress-backend-dc1-backend:
            queues:
              queue:
                unicast-0:
                  maximum-burst-size: 5211064
        queue-management-profile:
          egress-backend-dc1-backend-2:
            wred:
              wred-slope:
                all:
                  drop-probability:
                    all:
                      enable-ecn:
                        'true':
                          min-threshold-percent: 30
                          max-threshold-percent: 85
                          slope-enabled: true
                          max-drop-probability-percent: 100
      linecard:
        '1':
          forwarding-complex:
            '0':
              input:
                pfc-buffer-reservation: 10
      scheduler-policies:
        scheduler-policy:
          egress-backend-dc1-backend:
            scheduler:
              '0':
                input:
                  unicast-6:
                    queue-name: unicast-6
                    peak-rate-percent: 80
              '1':
                input:
                  unicast-0:
                    queue-name: unicast-0
                    peak-rate-percent: 10
                    weight: 10
