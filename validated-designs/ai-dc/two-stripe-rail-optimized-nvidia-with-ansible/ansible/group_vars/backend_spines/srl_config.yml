          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/14.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/15.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/16.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/3:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/4:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/5:
        admin-state: enable
        subinterface:
          '0':
