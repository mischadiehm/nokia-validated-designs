            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/7:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/8:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/9:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/10:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/11:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/12:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/13:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/14:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/15:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/16:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      system0:
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
    system:
      lldp:
        interface:
          ethernet-1/1:
            admin-state: enable
          ethernet-1/2:
            admin-state: enable
          ethernet-1/3:
            admin-state: enable
          ethernet-1/4:
            admin-state: enable
          ethernet-1/5:
            admin-state: enable
          ethernet-1/6:
            admin-state: enable
          ethernet-1/7:
            admin-state: enable
          ethernet-1/8:
            admin-state: enable
          ethernet-1/9:
            admin-state: enable
          ethernet-1/10:
            admin-state: enable
          ethernet-1/11:
            admin-state: enable
          ethernet-1/12:
            admin-state: enable
          ethernet-1/13:
            admin-state: enable
          ethernet-1/14:
            admin-state: enable
          ethernet-1/15:
            admin-state: enable
          ethernet-1/16:
            admin-state: enable
    network-instance:
      default:
        type: default
        admin-state: enable
        description: 'fabric: dc1-backend role: spine (stripe connector)'
        ip-forwarding:
          receive-ipv4-check: false
        interface:
          ethernet-1/1.0: {}
          ethernet-1/2.0: {}
          ethernet-1/3.0: {}
          ethernet-1/4.0: {}
          ethernet-1/5.0: {}
          ethernet-1/6.0: {}
          ethernet-1/7.0: {}
          ethernet-1/8.0: {}
          ethernet-1/9.0: {}
          ethernet-1/10.0: {}
          ethernet-1/11.0: {}
          ethernet-1/12.0: {}
          ethernet-1/13.0: {}
          ethernet-1/14.0: {}
          ethernet-1/15.0: {}
          ethernet-1/16.0: {}
          system0.0: {}
        protocols:
          bgp:
            admin-state: enable
            ebgp-default-policy:
              import-reject-all: true
              export-reject-all: true
            afi-safi:
              ipv6-unicast:
                admin-state: enable
                multipath:
                  allow-multiple-as: true
                  ebgp:
                    maximum-paths: 2
                evpn:
                  rapid-update: true
            preference:
              ebgp: 170
              ibgp: 170
            route-advertisement:
              rapid-withdrawal: true
              wait-for-fib-install: false
            group:
              bgpgroup-ebgp-dc1:
                admin-state: enable
                export-policy:
                - ebgp-isl-export-policy-dc1
                import-policy:
                - ebgp-isl-import-policy-dc1
                failure-detection:
                  enable-bfd: true
                  fast-failover: true
                afi-safi:
                  ipv6-unicast:
                    admin-state: enable
            autonomous-system: 100
            dynamic-neighbors:
              interface:
                ethernet-1/1.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 101
                ethernet-1/2.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 102
                ethernet-1/3.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 103
                ethernet-1/4.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 104
                ethernet-1/5.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 105
                ethernet-1/6.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 106
                ethernet-1/7.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 107
                ethernet-1/8.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 108
                ethernet-1/9.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 109
                ethernet-1/10.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 110
                ethernet-1/11.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 111
                ethernet-1/12.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 112
                ethernet-1/13.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 113
                ethernet-1/14.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 114
                ethernet-1/15.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 115
                ethernet-1/16.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as:
                  - 116
    routing-policy:
      prefix-set:
        prefixset-dc1:
          prefix:
            192.0.2.0/24:
              mask-length-range: 32..32
      policy:
        ebgp-isl-export-policy-dc1:
          default-action:
            policy-result: reject
          statement:
            '10':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                prefix-set: prefixset-dc1
                protocol: local
            '15':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                protocol: bgp
        ebgp-isl-import-policy-dc1:
          default-action:
            policy-result: reject
          statement:
            '10':
              action:
                policy-result: accept
                bgp:
                  local-preference:
                    set: 100
              match:
                protocol: bgp
    qos:
      buffer-management:
        buffer-allocation-profile:
          egress-backend-dc1-backend:
            queues:
              queue:
                unicast-0:
                  maximum-burst-size: 5211064
        queue-management-profile:
          egress-backend-dc1-backend-2:
            wred:
              wred-slope:
                all:
                  drop-probability:
                    all:
                      enable-ecn:
                        'true':
                          min-threshold-percent: 30
                          max-threshold-percent: 85
                          slope-enabled: true
                          max-drop-probability-percent: 100
      linecard:
        '1':
          forwarding-complex:
            '0':
              input:
                pfc-buffer-reservation: 10
      scheduler-policies:
        scheduler-policy:
          egress-backend-dc1-backend:
            scheduler:
              '0':
                input:
                  unicast-6:
                    queue-name: unicast-6
                    peak-rate-percent: 80
              '1':
                input:
                  unicast-0:
                    queue-name: unicast-0
                    peak-rate-percent: 10
                    weight: 10
