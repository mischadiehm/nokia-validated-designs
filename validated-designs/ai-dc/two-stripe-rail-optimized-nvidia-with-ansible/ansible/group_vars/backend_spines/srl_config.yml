---
# Backend spine (stripe connector) layer: 16 leaf-facing IPv6-unnumbered
# ports, dynamic eBGP neighbors per leaf ASN (101..116), shared spine ASN
# 100, and the same dc1-backend QoS configlets (spines are in the
# configlet endpointSelector).
srl_backend_spine_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
