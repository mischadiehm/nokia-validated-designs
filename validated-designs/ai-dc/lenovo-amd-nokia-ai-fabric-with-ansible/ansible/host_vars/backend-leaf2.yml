---
# Derived per-port from the gpu scripts (../lenovo-amd-nokia-ai-fabric/
# base-configs/gpu*.sh): every (leaf, port) pair is its own /96; the leaf
# gateway takes the complement address of the gpu side (gpu1 eth1 uses :0:2,
# every other gpu port uses :0:1). gpuVlan 100 from the Backend resource maps
# to subinterface index 100; the gpu scripts address the raw interface, so the
# subinterface stays port-routed (no vlan encap). Rails are leaf-local ip-vrfs
# (gpuIsolationGroups): leaf1 owns rail1..rail4 (ports P and P+4 pair up),
# leaf2 owns rail5..rail8. Cross-rail traffic must NOT work - that is the
# isolation acceptance test.
srl_host:
  update:
    system:
      name:
        host-name: backend-leaf2
      lldp:
        interface:
          ethernet-1/1:
            admin-state: enable
          ethernet-1/2:
            admin-state: enable
          ethernet-1/3:
            admin-state: enable
          ethernet-1/4:
            admin-state: enable
          ethernet-1/5:
            admin-state: enable
          ethernet-1/6:
            admin-state: enable
          ethernet-1/7:
            admin-state: enable
          ethernet-1/8:
            admin-state: enable
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:1:0:2/96: {}
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:2:0:2/96: {}
      ethernet-1/3:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:3:0:2/96: {}
      ethernet-1/4:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:4:0:2/96: {}
      ethernet-1/5:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:5:0:2/96: {}
      ethernet-1/6:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:6:0:2/96: {}
      ethernet-1/7:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:7:0:2/96: {}
      ethernet-1/8:
        admin-state: enable
        subinterface:
          '100':
            type: routed
            admin-state: enable
            ipv6:
              admin-state: enable
              address:
                fd00:100:2:1:0:8:0:2/96: {}
      system0:
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              address: 192.0.2.2/32
    network-instance:
      rail5:
        type: ip-vrf
        admin-state: enable
        description: gpu isolation group rail5
        interface:
          ethernet-1/1.100: {}
          ethernet-1/5.100: {}
      rail6:
        type: ip-vrf
        admin-state: enable
        description: gpu isolation group rail6
        interface:
          ethernet-1/2.100: {}
          ethernet-1/6.100: {}
      rail7:
        type: ip-vrf
        admin-state: enable
        description: gpu isolation group rail7
        interface:
          ethernet-1/3.100: {}
          ethernet-1/7.100: {}
      rail8:
        type: ip-vrf
        admin-state: enable
        description: gpu isolation group rail8
        interface:
          ethernet-1/4.100: {}
          ethernet-1/8.100: {}
      default:
        router-id: 192.0.2.2
        interface:
          system0.0: {}
    qos:
      interfaces:
        interface:
          ethernet-1/1:
            output:
              buffer-allocation-profile: rocev2-burst
          ethernet-1/2:
            output:
              buffer-allocation-profile: rocev2-burst
          ethernet-1/3:
            output:
              buffer-allocation-profile: rocev2-burst
          ethernet-1/4:
            output:
              buffer-allocation-profile: rocev2-burst
          ethernet-1/5:
            output:
              buffer-allocation-profile: rocev2-burst
          ethernet-1/6:
            output:
              buffer-allocation-profile: rocev2-burst
          ethernet-1/7:
            output:
              buffer-allocation-profile: rocev2-burst
          ethernet-1/8:
            output:
              buffer-allocation-profile: rocev2-burst
