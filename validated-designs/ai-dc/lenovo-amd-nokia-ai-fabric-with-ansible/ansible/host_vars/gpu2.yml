---
# Mirrors ../lenovo-amd-nokia-ai-fabric/base-configs/gpu2.sh: per-rail IPv6
# on eth1..eth8 (including the upstream gpu1 eth1 :0:2 quirk), active-backup
# storage bond eth10/eth11 (primary eth10), frontend ipv4 on eth9. The
# per-rail peer routes are an addition over the upstream script (which sets
# none): they make same-rail gpu-to-gpu reachability actually testable. The
# cross-rail entry must FAIL - that is the rail isolation acceptance check.
interfaces:
  eth1:
    ipv6:
    - fd00:100:1:1:0:5:0:1/96
  eth2:
    ipv6:
    - fd00:100:1:1:0:6:0:1/96
  eth3:
    ipv6:
    - fd00:100:1:1:0:7:0:1/96
  eth4:
    ipv6:
    - fd00:100:1:1:0:8:0:1/96
  eth5:
    ipv6:
    - fd00:100:2:1:0:5:0:1/96
  eth6:
    ipv6:
    - fd00:100:2:1:0:6:0:1/96
  eth7:
    ipv6:
    - fd00:100:2:1:0:7:0:1/96
  eth8:
    ipv6:
    - fd00:100:2:1:0:8:0:1/96
  eth9:
    ipv4:
    - 172.16.10.2/24
  bond0:
    ipv4:
    - 198.51.100.2/24
bonds:
  bond0:
    mode: active-backup
    primary: eth10
    miimon: 100
    members:
    - eth10
    - eth11
routes:
- family: ipv6
  to: fd00:100:1:1:0:1::/96
  via: fd00:100:1:1:0:5:0:2
  dev: eth1
- family: ipv6
  to: fd00:100:1:1:0:2::/96
  via: fd00:100:1:1:0:6:0:2
  dev: eth2
- family: ipv6
  to: fd00:100:1:1:0:3::/96
  via: fd00:100:1:1:0:7:0:2
  dev: eth3
- family: ipv6
  to: fd00:100:1:1:0:4::/96
  via: fd00:100:1:1:0:8:0:2
  dev: eth4
- family: ipv6
  to: fd00:100:2:1:0:1::/96
  via: fd00:100:2:1:0:5:0:2
  dev: eth5
- family: ipv6
  to: fd00:100:2:1:0:2::/96
  via: fd00:100:2:1:0:6:0:2
  dev: eth6
- family: ipv6
  to: fd00:100:2:1:0:3::/96
  via: fd00:100:2:1:0:7:0:2
  dev: eth7
- family: ipv6
  to: fd00:100:2:1:0:4::/96
  via: fd00:100:2:1:0:8:0:2
  dev: eth8
endpoint_ipv6_rail_ping_targets:
- target: fd00:100:1:1:0:1:0:2
  source: fd00:100:1:1:0:5:0:1
endpoint_ipv4_ping_targets:
- 172.16.10.3
- 172.16.10.1
- 198.51.100.3
