          lacp:
            interval: FAST
            lacp-mode: ACTIVE
            admin-key: 23
            system-id-mac: 00:0F:E0:00:00:03
            system-priority: 32768
      lag4:
        description: frontend-s4-lag
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
