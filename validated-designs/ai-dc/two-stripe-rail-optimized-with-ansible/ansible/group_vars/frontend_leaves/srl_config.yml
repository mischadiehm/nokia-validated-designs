          aggregate-id: lag12
          lacp-port-priority: 32768
          reload-delay: 100
      lag1:
        description: frontend-s1-lag
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
            type: bridged
            admin-state: enable
            vlan:
              encap: untagged
        lag:
          lag-type: lacp
          min-links: 1
          lacp-fallback-mode: static
          lacp-fallback-timeout: 60
          lacp:
            interval: FAST
            lacp-mode: ACTIVE
            admin-key: 21
            system-id-mac: 00:0F:E0:00:00:01
            system-priority: 32768
      lag2:
        description: frontend-s2-lag
        admin-state: enable
        vlan-tagging: true
        subinterface:
