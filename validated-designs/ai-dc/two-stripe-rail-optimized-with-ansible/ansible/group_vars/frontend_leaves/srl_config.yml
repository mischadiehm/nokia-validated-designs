---
# Frontend leaf layer, derived from frontend-fabric.yaml (eBGP underlay over
# IPv6-unnumbered ISLs + eBGP EVPN overlay, BFD 1s x3) and frontend-vnets.yaml
# (EVPNVXLAN bridge domain mac-vrf-storage, EVI/VNI 100, mac aging 300,
# proxy-ARP dynamic learning age/refresh 2000, ip-duplication 10/10/4,
# table-size 250). The four storage servers and eight weka nodes bond across
# both leaves => twelve all-active ESI-LAGs (ESIs/admin-keys pinned here; EDA
# would draw them from lag-admin-key-pool).
srl_frontend_leaf_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      system0:
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
      ethernet-1/3:
        description: frontend-s1-lag
        admin-state: enable
        ethernet:
          aggregate-id: lag1
          lacp-port-priority: 32768
          reload-delay: 100
      ethernet-1/4:
        description: frontend-s2-lag
        admin-state: enable
        ethernet:
          aggregate-id: lag2
          lacp-port-priority: 32768
          reload-delay: 100
      ethernet-1/5:
