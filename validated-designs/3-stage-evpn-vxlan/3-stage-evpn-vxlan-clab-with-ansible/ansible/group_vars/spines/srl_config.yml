---
# Spine layer (spine1, spine2), merged into srl_config by
# group_vars/srl/srl_config.yml. Per-spine specifics (host-name, system0 IP,
# router-id) live in host_vars/<spine>.yml under srl_host. Both spines share
# ASN 65500 and the full ISL fan-out to leaf1..leaf6.
srl_spine_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/3.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/4.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/5.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/6.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/3:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/4:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/5:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
      ethernet-1/6:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv6:
              admin-state: enable
              router-advertisement:
                router-role:
                  admin-state: enable
                  max-advertisement-interval: 10
                  min-advertisement-interval: 4
    system:
      lldp:
        interface:
          ethernet-1/1:
            admin-state: enable
          ethernet-1/2:
            admin-state: enable
          ethernet-1/3:
            admin-state: enable
          ethernet-1/4:
            admin-state: enable
          ethernet-1/5:
            admin-state: enable
          ethernet-1/6:
            admin-state: enable
    network-instance:
      default:
        description: "fabric: dc1 role: spine"
        interface:
          ethernet-1/1.0: {}
          ethernet-1/2.0: {}
          ethernet-1/3.0: {}
          ethernet-1/4.0: {}
          ethernet-1/5.0: {}
          ethernet-1/6.0: {}
          system0.0: {}
        protocols:
          bgp:
            autonomous-system: 65500
            dynamic-neighbors:
              interface:
                ethernet-1/1.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as: [65411]
                ethernet-1/2.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as: [65412]
                ethernet-1/3.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as: [65413]
                ethernet-1/4.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as: [65414]
                ethernet-1/5.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as: [65415]
                ethernet-1/6.0:
                  peer-group: bgpgroup-ebgp-dc1
                  allowed-peer-as: [65416]
            afi-safi:
              ipv4-unicast:
                multipath:
                  ebgp:
                    maximum-paths: 6
                  ibgp:
                    maximum-paths: 6
              ipv6-unicast:
                multipath:
                  ebgp:
                    maximum-paths: 6
                  ibgp:
                    maximum-paths: 6
