---
# leaf4: untagged access for s3 (macvrf-v20), lag1 member (ESI-LAG for s4,
# shared with leaf5), lag2 member (ESI-LAG for s8), node-isolation
# event-handler with e1-4 and e1-6 as isolation down-links.
srl_host:
  update:
    system:
      name:
        host-name: leaf4
      lldp:
        interface:
          ethernet-1/3:
            admin-state: enable
          ethernet-1/4:
            admin-state: enable
          ethernet-1/6:
            admin-state: enable
      event-handler:
        instance:
          overlay-bgp:
            admin-state: enable
            upython-script: node-isolation.py
            paths:
              - "network-instance default protocols bgp neighbor * session-state"
            options:
              object:
                down-links:
                  values: [ethernet-1/4, ethernet-1/6]
                hold-down-time:
                  value: 20000
                required-bgp-sessions-established:
                  value: 1
      network-instance:
        protocols:
          evpn:
            ethernet-segments:
              bgp-instance:
                '1':
                  ethernet-segment:
                    leaf4-leaf5-lag1:
                      admin-state: enable
                      esi: 00:00:00:00:00:44:55:00:00:00
                      multi-homing-mode: all-active
                      interface: lag1
                      df-election:
                        algorithm:
                          type: default
                    leaf2-leaf3-leaf4-leaf5-lag2:
                      admin-state: enable
                      esi: 00:00:00:22:33:44:55:00:00:00
                      multi-homing-mode: all-active
                      interface: lag2
                      df-election:
                        algorithm:
                          type: default
          bgp-vpn:
            bgp-instance:
              '1': {}
    interface:
      system0:
        subinterface:
          '0':
            ipv4:
              address: 192.0.2.14/32
      ethernet-1/3:
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
            type: bridged
            admin-state: enable
            vlan:
              encap: untagged
      ethernet-1/4:
        description: leaf4-leaf5-lag1
        admin-state: enable
        ethernet:
          aggregate-id: lag1
          lacp-port-priority: 32768
          reload-delay: 100
      ethernet-1/6:
        description: leaf2-leaf3-leaf4-leaf5-lag2
        admin-state: enable
        ethernet:
          aggregate-id: lag2
          lacp-port-priority: 32768
          reload-delay: 100
      lag1:
        description: leaf4-leaf5-lag1
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
            type: bridged
            admin-state: enable
            vlan:
              encap: untagged
        lag:
          lag-type: lacp
          min-links: 1
          lacp-fallback-mode: static
          lacp-fallback-timeout: 60
          lacp:
            interval: FAST
            lacp-mode: ACTIVE
            admin-key: 2
            system-id-mac: 00:00:00:00:44:55
            system-priority: 32768
      lag2:
        description: leaf2-leaf3-leaf4-leaf5-lag2
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
            type: bridged
            admin-state: enable
            vlan:
              encap: untagged
        lag:
          lag-type: lacp
          min-links: 1
          lacp-fallback-mode: static
          lacp-fallback-timeout: 60
          lacp:
            interval: FAST
            lacp-mode: ACTIVE
            admin-key: 1
            system-id-mac: 00:00:22:33:44:55
            system-priority: 32768
    network-instance:
      default:
        router-id: 192.0.2.14
        protocols:
          bgp:
            autonomous-system: 65414
            router-id: 192.0.2.14
      macvrf-v20:
        interface:
          ethernet-1/3.4096: {}
      macvrf-v30:
        interface:
          lag1.4096: {}
      macvrf-v50:
        interface:
          lag2.4096: {}
