---
# Per-spine intent (the srl_host layer). Common parts live in
# group_vars/{srl,spines}/. Keep readable; do not store rendered payloads here.
srl_host:
  update:
    interface:
      lo0:
        subinterface:
          '0':
            ipv4:
              address: 172.16.1.102/32
      system0:
        subinterface:
          '0':
            ipv4:
              address: 192.0.2.102/32
    network-instance:
      default:
        router-id: 192.0.2.102
        protocols:
          bgp:
            group:
              overlay:
                transport:
                  local-address: 192.0.2.102
            router-id: 192.0.2.102
