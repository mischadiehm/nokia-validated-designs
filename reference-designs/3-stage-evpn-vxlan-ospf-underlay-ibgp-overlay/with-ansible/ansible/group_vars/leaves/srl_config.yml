    tunnel-interface:
      vxlan0:
        vxlan-interface:
          '500':
            type: bridged
            ingress:
              vni: 10040
            egress:
              source-ip: use-system-ipv4-address
          '501':
            type: routed
            ingress:
              vni: 10500
            egress:
              source-ip: use-system-ipv4-address
          '502':
            type: bridged
            ingress:
              vni: 10020
            egress:
              source-ip: use-system-ipv4-address
          '503':
            type: routed
            ingress:
              vni: 10501
            egress:
              source-ip: use-system-ipv4-address
          '504':
            type: bridged
            ingress:
              vni: 10010
            egress:
              source-ip: use-system-ipv4-address
          '505':
            type: bridged
            ingress:
              vni: 10030
            egress:
              source-ip: use-system-ipv4-address
          '506':
            type: bridged
            ingress:
              vni: 10060
            egress:
              source-ip: use-system-ipv4-address
          '507':
            type: bridged
            ingress:
              vni: 10050
            egress:
              source-ip: use-system-ipv4-address
    routing-policy:
      policy:
        ebgp-isl-export-policy-dc1:
          default-action:
            policy-result: accept
        ebgp-isl-import-policy-dc1:
          default-action:
            policy-result: accept
