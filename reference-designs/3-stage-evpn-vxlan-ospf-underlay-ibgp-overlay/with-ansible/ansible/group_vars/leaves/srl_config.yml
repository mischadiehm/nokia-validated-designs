---
# Leaf layer (leaf1..leaf6), merged into srl_config by
# group_vars/srl/srl_config.yml. Everything identical on all six leaves lives
# here: ISLs to both spines, the full service catalog (six mac-vrfs, two
# ip-vrfs, anycast IRBs, the vxlan tunnel map). Per-leaf parts (host-name,
# ASN, system0 IP, access ports, LAGs/ESIs, event-handler) live in
# host_vars/<leaf>.yml under srl_host.
srl_leaf_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        system0.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      irb0:
        subinterface:
          '0':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.10.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '1':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.20.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '2':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.40.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '3':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.50.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '4':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.60.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '5':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.30.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
    system:
      lldp:
        interface:
          ethernet-1/1:
            admin-state: enable
          ethernet-1/2:
            admin-state: enable
    network-instance:
      default:
        description: "fabric: dc1 role: leaf"
        interface:
          ethernet-1/1.0: {}
          ethernet-1/2.0: {}
          lo0.0: {}
          system0.0: {}
        protocols:
          ospf:
            instance:
              '1':
                version: ospf-v2
                admin-state: enable
                area:
                  0.0.0.0:
                    interface:
                      ethernet-1/1.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/2.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      system0.0:
                        passive: true
          bgp:
            neighbor:
              192.0.2.101:
                admin-state: enable
                peer-group: overlay
              192.0.2.102:
                admin-state: enable
                peer-group: overlay
      macvrf-v10:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v10
        interface:
          irb0.0: {}
        vxlan-interface:
          vxlan0.504: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.504
                evi: 10
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:1:10
                  import-rt: target:1:10
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
      macvrf-v20:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v20
        interface:
          irb0.1: {}
        vxlan-interface:
          vxlan0.502: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.502
                evi: 20
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:1:20
                  import-rt: target:1:20
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
      macvrf-v30:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v30
        interface:
          irb0.5: {}
        vxlan-interface:
          vxlan0.505: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.505
                evi: 30
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:1:30
                  import-rt: target:1:30
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
      macvrf-v40:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v40
        interface:
          irb0.2: {}
        vxlan-interface:
          vxlan0.500: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.500
                evi: 40
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:1:40
                  import-rt: target:1:40
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
      macvrf-v50:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v50
        interface:
          irb0.3: {}
        vxlan-interface:
          vxlan0.507: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.507
                evi: 50
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:1:50
                  import-rt: target:1:50
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
      macvrf-v60:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v60
        interface:
          irb0.4: {}
        vxlan-interface:
          vxlan0.506: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.506
                evi: 60
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:1:60
                  import-rt: target:1:60
        bridge-table:
          mac-learning:
            admin-state: enable
            aging:
              admin-state: enable
              age-time: 300
          mac-duplication:
            admin-state: enable
            monitoring-window: 3
            num-moves: 5
            hold-down-time: 9
            action: stop-learning
      vrf1:
        type: ip-vrf
        admin-state: enable
        description: vrf1
        interface:
          irb0.0: {}
          irb0.1: {}
          irb0.5: {}
        vxlan-interface:
          vxlan0.501: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.501
                evi: 500
                ecmp: 8
                routes:
                  route-table:
                    mac-ip:
                      advertise-gateway-mac: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:1:500
                  import-rt: target:1:500
      vrf2:
        type: ip-vrf
        admin-state: enable
        description: vrf2
        interface:
          irb0.2: {}
          irb0.3: {}
          irb0.4: {}
        vxlan-interface:
          vxlan0.503: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.503
