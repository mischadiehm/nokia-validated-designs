---
# Spine layer (spine1, spine2), merged into srl_config by
# group_vars/srl/srl_config.yml. Per-spine specifics (host-name, system0 IP,
# router-id) live in host_vars/<spine>.yml under srl_host. Both spines share
# ASN 65500 and the full ISL fan-out to leaf1..leaf6.
srl_spine_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/3.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/4.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/5.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/6.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        system0.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/3:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/4:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/5:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/6:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
    network-instance:
      default:
        description: "fabric: dc1 role: spine"
        interface:
          ethernet-1/1.0: {}
          ethernet-1/2.0: {}
          ethernet-1/3.0: {}
          ethernet-1/4.0: {}
          ethernet-1/5.0: {}
          ethernet-1/6.0: {}
          lo0.0: {}
          system0.0: {}
        protocols:
          ospf:
            instance:
              '1':
                version: ospf-v2
                admin-state: enable
                area:
                  0.0.0.0:
                    interface:
                      ethernet-1/1.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/2.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/3.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/4.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/5.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/6.0:
                        admin-state: enable
                        interface-type: point-to-point
                        failure-detection:
                          enable-bfd: true
                      system0.0:
                        passive: true
          bgp:
            autonomous-system: 65500
            group:
              overlay:
                route-reflector:
                  client: true
                  cluster-id: 1
            neighbor:
              192.0.2.11:
                admin-state: enable
                peer-group: overlay
              192.0.2.12:
                admin-state: enable
                peer-group: overlay
              192.0.2.13:
                admin-state: enable
                peer-group: overlay
              192.0.2.14:
                admin-state: enable
                peer-group: overlay
              192.0.2.15:
                admin-state: enable
                peer-group: overlay
              192.0.2.16:
                admin-state: enable
                peer-group: overlay
