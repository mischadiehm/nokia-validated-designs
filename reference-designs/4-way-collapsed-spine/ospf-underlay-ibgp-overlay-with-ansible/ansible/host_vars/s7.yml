  to: 172.16.20.0/24
  via: 172.16.60.254
  dev: eth1
- family: ipv4
  to: 172.16.40.0/24
  via: 172.16.60.254
  dev: eth1
- family: ipv4
  to: 172.16.92.0/22
  via: 172.16.60.254
