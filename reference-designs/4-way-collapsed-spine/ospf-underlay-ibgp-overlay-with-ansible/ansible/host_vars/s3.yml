---
# s3: tor1 e1-3, vlan 10 untagged (ESI-LAG to spine1+spine2), vrf1 scope.
interfaces:
  eth1:
    ipv4:
    - 172.16.10.3/24
bonds: {}
routes:
- family: ipv4
  to: 172.16.20.0/24
  via: 172.16.10.254
  dev: eth1
- family: ipv4
  to: 172.16.40.0/24
  via: 172.16.10.254
  dev: eth1
- family: ipv4
  to: 172.16.60.0/24
  via: 172.16.10.254
  dev: eth1
- family: ipv4
  to: 172.16.92.0/22
  via: 172.16.10.254
  dev: eth1
endpoint_ipv4_ping_targets:
- 172.16.10.254
- 172.16.10.1
- target: 172.16.60.7
  source: 172.16.10.3
