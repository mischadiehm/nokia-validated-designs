---
# Spine layer: OSPFv2 underlay (area 0, p2p ISLs with BFD, passive system0,
# IPv4-unnumbered ISLs borrowing lo0 172.16.1.x) under the iBGP EVPN overlay
# (all spines AS 65500, loopback peering, multihop, BFD incl. system0.0).
# Services, lag2 and the IRB set are identical to the eBGP sibling,
# including the irb0.70 gateway-address quirk.
srl_spine_common:
  update:
    bfd:
      subinterface:
        ethernet-1/1.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/2.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        ethernet-1/3.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
        system0.0:
          admin-state: enable
          desired-minimum-transmit-interval: 1000000
          required-minimum-receive: 1000000
          detection-multiplier: 3
          minimum-echo-receive-interval: 1000000
    interface:
      ethernet-1/1:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/2:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/3:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
              unnumbered:
                admin-state: enable
                interface: lo0.0
      ethernet-1/6:
        description: spine1-spine2-spine3-spine4-lag2
        admin-state: enable
        ethernet:
          aggregate-id: lag2
          lacp-port-priority: 32768
          reload-delay: 100
      lag2:
        description: spine1-spine2-spine3-spine4-lag2
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '40':
            type: bridged
            admin-state: enable
            vlan:
              encap:
                single-tagged:
                  vlan-id: 40
          '50':
            type: bridged
            admin-state: enable
            vlan:
              encap:
                single-tagged:
                  vlan-id: 50
        lag:
          lag-type: lacp
          min-links: 1
          lacp-fallback-mode: static
          lacp-fallback-timeout: 60
          lacp:
            interval: FAST
            lacp-mode: ACTIVE
            admin-key: 2
            system-id-mac: 00:00:11:22:33:44
            system-priority: 32768
      irb0:
        subinterface:
          '10':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.10.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '20':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.20.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '30':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.30.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '40':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.40.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '50':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.50.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '60':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.60.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
          '70':
            ip-mtu: 1500
            ipv4:
              admin-state: enable
              address:
                172.16.60.254/24:
                  anycast-gw: true
                  primary: ''
              arp:
                timeout: 250
                proxy-arp: true
                evpn:
                  advertise: dynamic
            anycast-gw:
              virtual-router-id: 1
      system0:
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
      lo0:
        admin-state: enable
        subinterface:
          '0':
            admin-state: enable
            ipv4:
              admin-state: enable
    system:
      network-instance:
        protocols:
          evpn:
            ethernet-segments:
              bgp-instance:
                '1':
                  ethernet-segment:
                    spine1-spine2-spine3-spine4-lag2:
                      admin-state: enable
                      esi: 00:00:00:00:11:22:33:44:00:00
                      multi-homing-mode: all-active
                      interface: lag2
                      df-election:
                        timers:
                          activation-timer: 0
                        algorithm:
                          type: default
          bgp-vpn:
            bgp-instance:
              '1': {}
    network-instance:
      default:
        type: default
        admin-state: enable
        interface:
          ethernet-1/1.0: {}
          ethernet-1/2.0: {}
          ethernet-1/3.0: {}
          system0.0: {}
          lo0.0: {}
        protocols:
          ospf:
            instance:
              '1':
                version: ospf-v2
                admin-state: enable
                area:
                  0.0.0.0:
                    interface:
                      ethernet-1/1.0:
                        admin-state: enable
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/2.0:
                        admin-state: enable
                        failure-detection:
                          enable-bfd: true
                      ethernet-1/3.0:
                        admin-state: enable
                        failure-detection:
                          enable-bfd: true
                      system0.0:
                        passive: true
          bgp:
            admin-state: enable
            ebgp-default-policy:
              import-reject-all: true
              export-reject-all: true
            afi-safi:
              ipv4-unicast:
                admin-state: enable
                multipath:
                  allow-multiple-as: true
                  ebgp:
                    maximum-paths: 64
                ipv4-unicast:
                  advertise-ipv6-next-hops: true
                  receive-ipv6-next-hops: true
                evpn:
                  rapid-update: true
              evpn:
                admin-state: enable
                multipath:
                  ibgp:
                    maximum-paths: 64
                evpn:
                  rapid-update: true
            preference:
              ebgp: 170
              ibgp: 170
            route-advertisement:
              rapid-withdrawal: true
              wait-for-fib-install: false
            group:
              bgp-overlay:
                admin-state: enable
                peer-as: 65500
                export-policy:
                - allow-all
                import-policy:
                - allow-all
                failure-detection:
                  enable-bfd: true
                  fast-failover: true
                multihop:
                  admin-state: enable
                afi-safi:
                  evpn:
                    admin-state: enable
                  ipv4-unicast:
                    admin-state: disable
            autonomous-system: 65500
      macvrf-v40:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v40
        interface:
          irb0.40: {}
          lag2.40: {}
        vxlan-interface:
          vxlan0.540: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.540
                evi: 40
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:40:40
                  import-rt: target:40:40
      macvrf-v50:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v50
        interface:
          irb0.50: {}
          lag2.50: {}
        vxlan-interface:
          vxlan0.550: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.550
                evi: 50
                ecmp: 8
                routes:
                  bridge-table:
                    mac-ip:
                      advertise-arp-nd-only-with-mac-table-entry: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:50:50
                  import-rt: target:50:50
      vrf1:
        type: ip-vrf
        admin-state: enable
        description: vrf1
        interface:
          irb0.10: {}
          irb0.20: {}
          irb0.40: {}
          irb0.60: {}
        vxlan-interface:
          vxlan0.500: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.500
                evi: 500
                ecmp: 8
                routes:
                  route-table:
                    mac-ip:
                      advertise-gateway-mac: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:500:500
                  import-rt: target:500:500
      vrf2:
        type: ip-vrf
        admin-state: enable
        description: vrf2
        interface:
          irb0.30: {}
          irb0.50: {}
          irb0.70: {}
        vxlan-interface:
          vxlan0.501: {}
        protocols:
          bgp-evpn:
            bgp-instance:
              '1':
                vxlan-interface: vxlan0.501
                evi: 501
                ecmp: 8
                routes:
                  route-table:
                    mac-ip:
                      advertise-gateway-mac: true
          bgp-vpn:
            bgp-instance:
              '1':
                route-target:
                  export-rt: target:501:501
                  import-rt: target:501:501
    routing-policy:
      policy:
        allow-all:
          default-action:
            policy-result: accept
    tunnel-interface:
      vxlan0:
        vxlan-interface:
          '500':
            type: routed
            ingress:
              vni: 10500
            egress:
              source-ip: use-system-ipv4-address
          '501':
            type: routed
            ingress:
              vni: 10501
            egress:
              source-ip: use-system-ipv4-address
          '510':
            type: bridged
            ingress:
              vni: 10010
            egress:
              source-ip: use-system-ipv4-address
          '520':
            type: bridged
            ingress:
              vni: 10020
            egress:
              source-ip: use-system-ipv4-address
          '530':
            type: bridged
            ingress:
              vni: 10030
            egress:
              source-ip: use-system-ipv4-address
          '540':
            type: bridged
            ingress:
              vni: 10040
            egress:
              source-ip: use-system-ipv4-address
          '550':
            type: bridged
            ingress:
              vni: 10050
            egress:
              source-ip: use-system-ipv4-address
          '560':
            type: bridged
            ingress:
              vni: 10060
            egress:
              source-ip: use-system-ipv4-address
          '570':
            type: bridged
            ingress:
              vni: 10070
            egress:
              source-ip: use-system-ipv4-address
  delete:
    system:
      aaa:
        authentication:
          admin-user:
            ssh-key: {}
          linuxadmin-user:
            ssh-key: {}
