---
# Ansible collections required by the 4-way collapsed-spine ebgp-underlay-ibgp-overlay reference design variant.
# Install with: uv run ansible-galaxy collection install -r requirements.yml
# Nokia owns the supported SR Linux transport/modules. Narrowin owns the
# intent renderer, pruning/guard filters, and srl_config/srl_validate roles.
collections:
  - name: nokia.srlinux
    version: "1.1.1"
    source: https://galaxy.ansible.com
  - name: git@github.com:narrowin/ansible-collection-nokia-srlinux-intent.git
    type: git
    version: "7b75a54cf64351137d5eb694c7627e8086ea3451"
  - name: ansible.netcommon
    version: "5.3.0"
    source: https://galaxy.ansible.com
  - name: ansible.utils
    version: "3.1.0"
    source: https://galaxy.ansible.com
  - name: community.docker          # drive the Linux endpoints (s1..s9) via the clab runtime
    version: "3.13.4"
    source: https://galaxy.ansible.com
