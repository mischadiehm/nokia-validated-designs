---
# s6: tor2 e1-6, vlan 50 untagged, vrf2 scope.
interfaces:
  eth1:
    ipv4:
    - 172.16.50.6/24
bonds: {}
routes:
- family: ipv4
  to: 172.16.30.0/24
  via: 172.16.50.254
  dev: eth1
- family: ipv4
  to: 172.16.70.0/24
  via: 172.16.50.254
  dev: eth1
endpoint_ipv4_ping_targets:
- 172.16.50.254
- target: 172.16.30.4
  source: 172.16.50.6
