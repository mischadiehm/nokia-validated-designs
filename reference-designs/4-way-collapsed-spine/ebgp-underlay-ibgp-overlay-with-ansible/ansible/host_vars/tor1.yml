---
# Plain L2 access tor; no host-name, BGP or bridge-table in the oracle.
srl_host:
  update:
    interface:
      ethernet-1/1:
        description: spine1-spine2-lag1
        admin-state: enable
        ethernet:
          aggregate-id: lag1
      ethernet-1/2:
        description: spine1-spine2-lag1
        admin-state: enable
        ethernet:
          aggregate-id: lag1
      ethernet-1/3:
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
            type: bridged
            admin-state: enable
            vlan:
              encap: untagged
      ethernet-1/4:
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '4096':
            type: bridged
            admin-state: enable
            vlan:
              encap: untagged
      lag1:
        description: spine1-spine2-lag1
        admin-state: enable
        vlan-tagging: true
        subinterface:
          '10':
            type: bridged
            admin-state: enable
            vlan:
              encap:
                single-tagged:
                  vlan-id: 10
          '30':
            type: bridged
            admin-state: enable
            vlan:
              encap:
                single-tagged:
                  vlan-id: 30
        lag:
          lag-type: lacp
          min-links: 1
          lacp-fallback-mode: static
          lacp-fallback-timeout: 60
          lacp:
            interval: FAST
            lacp-mode: ACTIVE
            admin-key: 1
            system-id-mac: 00:00:00:11:11:11
    network-instance:
      macvrf-v10:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v10
        interface:
          ethernet-1/3.4096: {}
          lag1.10: {}
      macvrf-v30:
        type: mac-vrf
        admin-state: enable
        description: macvrf-v30
        interface:
          ethernet-1/4.4096: {}
          lag1.30: {}
