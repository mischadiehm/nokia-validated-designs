# s5: L3 routed access on leaf1 e1-4.4097 (172.16.100.0/31 leaf side). Loopback
# subnets live on dummies inside VRF table 1 and are advertised by leaf1 as
# EVPN type-5 routes. Mirrors base-configs/s5.sh including its upstream quirk:
# lo2 and lo3 both carry 172.16.93.5/24, and 172.16.95.0/24 is static-routed on
# leaf1 but has no address here.
interfaces:
  eth1:
    ipv4:
    - 172.16.100.1/24
bonds: {}
dummies:
  lo1:
    ipv4:
    - 172.16.92.5/24
  lo2:
    ipv4:
    - 172.16.93.5/24
  lo3:
    ipv4:
    - 172.16.93.5/24
  lo4:
    ipv4:
    - 172.16.94.5/24
vrfs:
  clab-vrf:
    table: 1
    members:
    - eth1
    - lo1
    - lo2
    - lo3
    - lo4
routes:
- {family: ipv4, to: 0.0.0.0/0, via: 172.16.100.0, table: 1}
endpoint_ipv4_ping_targets:
- target: 172.16.100.0
  source: clab-vrf
- target: 172.16.10.1
  source: clab-vrf
- target: 172.16.20.3
  source: clab-vrf
