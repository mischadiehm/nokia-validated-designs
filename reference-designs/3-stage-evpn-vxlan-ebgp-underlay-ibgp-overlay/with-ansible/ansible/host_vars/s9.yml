# s9: single link to leaf6 e1-6, vlan 60 untagged, vrf2 scope.
interfaces:
  eth1:
    ipv4:
    - 172.16.60.9/24
bonds: {}
routes:
- {family: ipv4, to: 172.16.40.0/24, via: 172.16.60.254, dev: eth1}
- {family: ipv4, to: 172.16.50.0/24, via: 172.16.60.254, dev: eth1}
endpoint_ipv4_ping_targets:
- 172.16.60.254
- target: 172.16.40.7
  source: 172.16.60.9
- target: 172.16.50.8
  source: 172.16.60.9
