# s3: single link to leaf4 e1-3, vlan 20 untagged, vrf1 scope.
interfaces:
  eth1:
    ipv4:
    - 172.16.20.3/24
bonds: {}
routes:
- {family: ipv4, to: 172.16.10.0/24, via: 172.16.20.254, dev: eth1}
- {family: ipv4, to: 172.16.30.0/24, via: 172.16.20.254, dev: eth1}
- {family: ipv4, to: 172.16.92.0/22, via: 172.16.20.254, dev: eth1}
endpoint_ipv4_ping_targets:
- 172.16.20.254
- target: 172.16.10.1
  source: 172.16.20.3
- target: 172.16.92.5
  source: 172.16.20.3
