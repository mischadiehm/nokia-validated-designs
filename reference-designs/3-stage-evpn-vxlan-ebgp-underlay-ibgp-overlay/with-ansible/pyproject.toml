[project]
name = "three-stage-ebgp-ibgp-overlay-with-ansible"
version = "0.1.0"
description = "Ansible-managed Nokia 3-stage EVPN-VXLAN eBGP-underlay/iBGP-overlay reference design lab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core==2.21.0",
    "ansible-lint==26.4.0",
    "pyyaml>=6,<7",
    "requests==2.34.2",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
include-package-data = false
